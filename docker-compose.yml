# Sobe um Postgres local para desenvolvimento: `docker compose up -d db`
services:
  db:
    image: postgres:16
    container_name: kais-db
    environment:
      POSTGRES_USER: kais
      POSTGRES_PASSWORD: kais
      POSTGRES_DB: kais
    ports:
      - "5432:5432"
    volumes:
      - kais-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kais -d kais"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kais-db:
